# PrecisionFix — owner-editable site. Deployed as its OWN Netlify site
# (project `precisionfix`), decoupled from the handprotocol repo's git auto-deploy.
# Generated by scripts/gen-netlify-toml.mjs from site.config.mjs.
#
#   cd clients/precisionfix && netlify deploy --prod --build --site <site-id>
#
# This local toml pins the publish dir and functions dir so a deploy from
# inside the monorepo never inherits the root netlify.toml (the HAND site).
[build]
  publish = "public"
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Owner uploads live in Supabase Storage; Netlify Image CDN resizes them.
[images]
  remote_images = ["https://vconmgerblqbworcqkvr\\.supabase\\.co/storage/v1/object/public/precisionfix/.*"]

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# self-hosted font files are named by their content, so they never change in place
[[headers]]
  for = "/assets/fonts/files/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
